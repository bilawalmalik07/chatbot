<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>D-Starix Chat Assistant</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <div class="stage">
    <header class="bar">
      <div class="mark" id="mark"></div>
      <div class="bar-text">
        <h1>D-Starix Chat Assistant</h1>
        <p class="model-tag">Gemini 2.5 Flash</p>
      </div>
      <button class="ghost-btn" id="resetBtn">New chat</button>
    </header>

    <main class="log" id="log">
      <div class="row bot">
        <div class="note">
          <p>Hi — I'm your AI assistant. Ask me anything.</p>
        </div>
      </div>
    </main>

    <form class="composer" id="composerForm" autocomplete="off">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message…"
        maxlength="1000"
      />
      <button type="submit" id="sendBtn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
          <path d="M2 10L17.5 2.5L11 17.5L9 11L2 10Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
